<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Gadgets - Typography & Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <header class="typography-header">
            <h1>Premium Tech Collection</h1>
            <p class="subtitle">Showcasing design tokens and CSS box model structure.</p>
        </header>

        <main class="product-showcase">
            <!-- Box Model Product Card -->
            <div class="gadget-card">
                <div class="card-image-box">
                    <span class="image-label">13.6-inch Laptop</span>
                </div>
                <div class="card-content">
                    <h2 class="card-title">M5 Silicon Machine</h2>
                    <p class="card-desc">High-end computing hardware running macOS. Perfect for heavy IDEs and web development workflows.</p>
                    <div class="price-tag">₹1,14,900</div>
                    <button class="buy-btn">Add to Cart</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
