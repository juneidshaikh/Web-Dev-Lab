<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeStream - Grid & Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CSS GRID: Main App Container -->
    <div class="app-container">
        
        <!-- SIDEBAR (Grid Item, contains Flexbox) -->
        <aside class="side-panel">
            <div class="brand">VibeStream</div>
            <nav class="side-nav">
                <a href="#">Home</a>
                <a href="#">Search</a>
                <a href="#">Your Library</a>
            </nav>
            <div class="playlist-links">
                <a href="#">Late Night R&B</a>
                <a href="#">Metro Boomin Beats</a>
                <a href="#">Indie Hindi (Aarzu)</a>
            </div>
        </aside>

        <!-- MAIN CONTENT (Grid Item, contains Flexbox) -->
        <main class="main-view">
            <header class="top-bar">
                <div class="nav-buttons">
                    <button>&lt;</button>
                    <button>&gt;</button>
                </div>
                <div class="user-profile">Juneid Shaikh</div>
            </header>

            <section class="content-section">
                <h2>Recently Played</h2>
                <!-- FLEXBOX: Card Row -->
                <div class="album-row">
                    <div class="album-card">
                        <div class="cover dark-cover"></div>
                        <h3>After Hours</h3>
                        <p>The Weeknd</p>
                    </div>
                    <div class="album-card">
                        <div class="cover orange-cover"></div>
                        <h3>Heroes & Villains</h3>
                        <p>Metro Boomin</p>
                    </div>
                    <div class="album-card">
                        <div class="cover blue-cover"></div>
                        <h3>Indie Mix</h3>
                        <p>Chal Re Chal Re Baarish</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- BOTTOM PLAYER (Grid Item, contains Flexbox) -->
        <footer class="now-playing-bar">
            <!-- Flex Item 1 -->
            <div class="track-info">
                <h4>Starboy</h4>
                <p>The Weeknd</p>
            </div>
            
            <!-- Flex Item 2 -->
            <div class="player-controls">
                <button>Prev</button>
                <button class="play-btn">Play</button>
                <button>Next</button>
            </div>
            
            <!-- Flex Item 3 -->
            <div class="volume-control">
                <span>Volume</span>
                <div class="vol-bar"></div>
            </div>
        </footer>
        
    </div>
</body>
</html>
