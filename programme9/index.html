<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Gallery - Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Responsive Flexbox Navbar -->
    <header class="arch-header">
        <div class="logo-box">ArchVision</div>
        <nav class="arch-nav-menu">
            <a href="#gallery">Gallery</a>
            <a href="#studios">Studios</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main class="gallery-section">
        <div class="section-title">
            <h1>Modern Spaces</h1>
            <p>Responsive photo gallery using CSS Flexbox wrap</p>
        </div>

        <!-- Flexbox Wrap Gallery -->
        <div class="arch-gallery-wrap">
            <div class="arch-photo-card">
                <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=500&q=80" alt="Modern living room">
                <div class="card-caption">Minimalist Interior</div>
            </div>
            
            <div class="arch-photo-card">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500&q=80" alt="Exterior facade">
                <div class="card-caption">Geometric Facade</div>
            </div>
            
            <div class="arch-photo-card">
                <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=500&q=80" alt="Open space apartment">
                <div class="card-caption">Open Concept</div>
            </div>

            <div class="arch-photo-card">
                <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511?w=500&q=80" alt="Wooden staircase">
                <div class="card-caption">Organic Textures</div>
            </div>
        </div>
    </main>
</body>
</html>
